name: Notion Summary Automation

on:
  schedule:
    - cron: '0 9 * * *'  # 매일 UTC 기준 오전 9시 실행
  workflow_dispatch:      # 수동 실행 가능

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests google-generativeai langdetect

      - name: Run Notion Summary Script
        run: python notion_summary.py
