# 저장소 루트에서 .github/workflows 폴더 생성
!mkdir -p .github/workflows

# 워크플로우 파일 생성 및 내용 작성
%%writefile .github/workflows/notion_summary.yml
name: Notion Summary Automation

on:
  schedule:
    - cron: '0 9 * * *'  # 매일 UTC 기준 오전 9시 실행
  workflow_dispatch:      # 수동 실행 가능

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests google-generativeai langdetect

      - name: Run Notion Summary Script
        run: python notion_summary.py

